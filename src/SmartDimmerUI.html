<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Dimmer</title>
<style>
:root{
  --bg:#1B1B1F; --panel:#2A2A31; --line:#35353D; --text:#F2F2F2; --muted:#A3A3AD; --accent:#FFA24A;
  --btn:#2A2A31; --btnText:#F2F2F2; --check:#FFA24A; --track:#35353D; --fill:#FFA24A; --thumb:#FFA24A;
  --graphBg:#262525; --grid:#6E6E6E;
  --r:16px; --shadow:0 14px 36px rgba(0,0,0,.45);
  --op:65%;
  /* derived surfaces: solid by default, translucent in glass mode */
  --surface:var(--bg); --panelS:var(--panel);
  --accentHi:color-mix(in srgb,var(--accent) 72%,#fff 28%);   /* calm look: lighter accent for gradients */
  --accent2:#FF4D6D;                                           /* the theme's second accent (set from the theme) */
  --hl:inset 0 1px 0 rgba(255,255,255,.055);
}
*{box-sizing:border-box}
html{height:100%;background:transparent}
body{height:100%;margin:0;background:var(--bg);color:var(--text);font:14px/1.4 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;overflow:hidden;transition:background .35s,color .35s}
/* glass mode: the window shows the blurred desktop through a tinted page (see ApplyGlass in the engine) */
html.glass{--surface:color-mix(in srgb,var(--bg) 55%,transparent);--panelS:color-mix(in srgb,var(--panel) 62%,transparent)}
html.glass body{background:color-mix(in srgb,var(--bg) var(--op),transparent);border-radius:var(--wr,14px);overflow:hidden}
/* glass + Wallpaper theme: a frosted copy of the wallpaper region behind the window, aligned to the screen, over the real acrylic */
#wp{position:fixed;left:-40px;top:-40px;right:-40px;bottom:-40px;z-index:0;display:none;background-repeat:no-repeat;filter:blur(22px) saturate(1.25);opacity:.88;pointer-events:none}
#wp::after{content:"";position:absolute;inset:0;background:color-mix(in srgb,var(--bg) var(--op),transparent)}
html.wp #wp{display:block}
html.wp body{background:transparent}
#app{position:relative;z-index:1}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--muted)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}

/* ---------- header (drag handle) ---------- */
.hdr{display:flex;align-items:center;gap:12px;padding:12px 16px 10px;background:linear-gradient(180deg,var(--panelS),transparent);border-bottom:1px solid color-mix(in srgb,var(--line) 80%,transparent);cursor:default;app-region:drag;-webkit-app-region:drag}
.hdr button{app-region:no-drag;-webkit-app-region:no-drag}
.hdr .logo{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--accentHi),color-mix(in srgb,var(--accent) 55%,#000));box-shadow:0 0 22px color-mix(in srgb,var(--accent) 45%,transparent),var(--hl);
  display:grid;place-items:center;font-size:18px;position:relative}
.hdr .logo::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;box-shadow:0 0 30px color-mix(in srgb,var(--accent) 65%,transparent);
  opacity:0;animation:glow 4s steps(12,jump-none) infinite;will-change:opacity}
@keyframes glow{0%,100%{opacity:0}50%{opacity:1}}
.hdr .t{flex:1;min-width:0}
.hdr .t b{display:block;font-size:17px;color:var(--accent);letter-spacing:.2px}
.hdr .t span{font-size:11.5px;color:var(--muted)}
.icon-btn{width:34px;height:34px;border-radius:10px;border:1px solid transparent;background:transparent;color:var(--muted);display:grid;place-items:center;font-size:16px;transition:background .15s,color .15s,transform .1s}
.icon-btn:hover{background:var(--panelS);color:var(--text)}
.icon-btn:active{transform:scale(.94)}
.icon-btn.close:hover{background:#c0392b;color:#fff}
.icon-btn.big{width:44px;height:44px;font-size:24px;border-radius:12px;color:var(--accent)}
.icon-btn.big:hover{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}

/* ---------- layout ---------- */
#app{height:100%;display:flex;flex-direction:column}
.scroll{flex:1;overflow:auto;padding:14px 16px 16px}
.sec{margin:14px 0 6px;font-size:11px;font-weight:700;letter-spacing:1.4px;color:var(--accent);text-transform:uppercase;display:flex;align-items:center;gap:10px}
.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.card{background:linear-gradient(160deg,color-mix(in srgb,var(--panelS) 94%,#fff 6%),var(--panelS));border:1px solid color-mix(in srgb,var(--line) 85%,transparent);border-radius:var(--r);padding:14px 16px;margin-top:10px;
  box-shadow:var(--hl),0 6px 18px rgba(0,0,0,.22);transition:transform .2s,box-shadow .2s,border-color .2s,background .35s}
.card:hover{transform:translateY(-1px);box-shadow:var(--hl),var(--shadow);border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.row{display:flex;align-items:center;gap:12px}
.row.between{justify-content:space-between}
.muted{color:var(--muted);font-size:12.5px}
.small{font-size:11.5px}
.reveal{animation:fadeUp .35s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.stagger>*{animation:fadeUp .4s ease both}
.stagger>*:nth-child(2){animation-delay:.05s}.stagger>*:nth-child(3){animation-delay:.1s}.stagger>*:nth-child(4){animation-delay:.15s}.stagger>*:nth-child(5){animation-delay:.2s}.stagger>*:nth-child(6){animation-delay:.25s}

/* ---------- controls ---------- */
.btn{background:var(--btn);color:var(--btnText);border:1px solid var(--line);border-radius:11px;padding:8px 14px;font-weight:600;box-shadow:var(--hl);transition:transform .1s,filter .15s,border-color .15s,background .35s,box-shadow .2s;white-space:nowrap}
.btn:hover{filter:brightness(1.15);border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,var(--accentHi),var(--accent));color:#141416;border-color:transparent;box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 35%,transparent)}
.btn.primary:hover{box-shadow:0 6px 20px color-mix(in srgb,var(--accent) 50%,transparent)}
.btn.ghost{background:transparent;box-shadow:none}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:9px}
.btn.danger:hover{background:#c0392b;color:#fff}
.btn:disabled{opacity:.5;cursor:default;filter:none;transform:none}
.field{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 10px;color:var(--text);outline:none;transition:border-color .15s,box-shadow .15s}
.field:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.field.center{text-align:center}
/* switch */
.sw{position:relative;display:inline-flex;align-items:center;gap:10px;cursor:pointer}
.sw input{position:absolute;opacity:0;width:0;height:0}
.sw .k{width:42px;height:24px;border-radius:24px;background:var(--track);border:1px solid var(--line);position:relative;transition:background .25s,border-color .25s;flex:none}
.sw .k::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--muted);transition:transform .25s cubic-bezier(.34,1.56,.64,1),background .25s}
.sw input:checked+.k{background:linear-gradient(135deg,color-mix(in srgb,var(--check) 75%,#fff 25%),var(--check));border-color:var(--check);box-shadow:0 0 12px color-mix(in srgb,var(--check) 40%,transparent)}
.sw input:checked+.k::after{transform:translateX(18px);background:#141416}
.sw input:focus-visible+.k{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent)}
/* checkbox */
.cb{display:inline-flex;align-items:center;gap:9px;cursor:pointer}
.cb input{position:absolute;opacity:0;width:0;height:0}
.cb .b{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--muted);background:var(--surface);display:grid;place-items:center;transition:all .2s;flex:none}
.cb .b::after{content:"";width:6px;height:11px;border:solid #141416;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) scale(0);transition:transform .2s cubic-bezier(.34,1.56,.64,1);margin-top:-3px}
.cb input:checked+.b{background:var(--check);border-color:var(--check)}
.cb input:checked+.b::after{transform:rotate(45deg) scale(1)}
/* compact tick (per-screen Backlight / Software ticks in the flyout) */
.cb.sm{gap:6px;font-size:12.5px;color:var(--muted)}
.cb.sm .b{width:16px;height:16px;border-radius:5px}
.cb.sm .b::after{width:4px;height:8px;border-width:0 2px 2px 0;margin-top:-2px}
.cb.sm input:checked~span:last-child{color:var(--text)}
.ticks{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin:2px 0 8px}
.ticks .lbl{font-size:11.5px;color:var(--muted);opacity:.8}
.sl .lab .n .cb.sm{font-size:inherit;color:inherit}
.sl.off .lab .v{color:var(--muted);opacity:.6}
/* slider */
.sl{display:block;margin-top:6px}
.sl .lab{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.sl .lab .n{color:var(--muted)}
.sl .lab .v{font-size:22px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;transition:transform .15s}
.sl .lab .v.bump{transform:scale(1.15)}
.sl.small .lab .v{font-size:16px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:26px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:6px;background:linear-gradient(90deg,color-mix(in srgb,var(--fill) 80%,#fff 20%) 0,var(--fill) var(--p,50%),var(--track) var(--p,50%) 100%);transition:background .2s}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--thumb);margin-top:-7px;border:3px solid var(--bg);box-shadow:0 2px 8px rgba(0,0,0,.5),0 0 10px color-mix(in srgb,var(--thumb) 35%,transparent);transition:transform .15s,box-shadow .15s}
input[type=range]:hover::-webkit-slider-thumb{transform:scale(1.15);box-shadow:0 0 0 6px color-mix(in srgb,var(--thumb) 25%,transparent)}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.25)}
input[type=range]:disabled{opacity:.4}
/* warmth: the track shows the colour temperature range, neutral white to candle orange */
html .sl.warm input[type=range]::-webkit-slider-runnable-track{background:linear-gradient(90deg,#f4f7ff 0,#ffd9ad 40%,#ffab5e 75%,#ff7b24 100%);opacity:.9}
/* automatic theme */
.slotgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.slotgrid.five{grid-template-columns:repeat(5,minmax(0,1fr))}
@media (max-width:820px){.slotgrid,.slotgrid.five{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}}
.slot{display:flex;flex-direction:column;gap:6px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.slot.now{border-color:color-mix(in srgb,var(--accent) 65%,transparent)}
.slot>span{font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:6px}
.slot .badge{margin-left:auto}
select.field{width:100%;cursor:pointer}
.slot select.field{padding:6px 2px 6px 7px;font-size:12.5px;text-overflow:ellipsis}
select.field option{background:var(--bg);color:var(--text)}
.places{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.place{text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:10px;padding:8px 12px;cursor:pointer;font:inherit}
.place:hover{border-color:var(--accent)}
/* warmth schedule page */
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:760px){.grid3{grid-template-columns:1fr}}
.phase .ph-h{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
.phase .ph-h .ic{font-size:18px;line-height:1}
.phase .ph-h .badge{margin-left:auto}
.phase .ph-t{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:12px 0 4px}
.phase.now{border-color:color-mix(in srgb,var(--accent) 65%,transparent)}
#warmchart{display:block;width:100%;height:190px;margin-top:12px;border-radius:12px;background:var(--graphBg)}
.timef{width:84px;text-align:center;font-variant-numeric:tabular-nums}
.warnline{display:flex;gap:8px;align-items:flex-start;font-size:11.5px;margin-top:10px;padding:8px 10px;border-radius:10px;
  background:color-mix(in srgb,#ffb347 14%,transparent);border:1px solid color-mix(in srgb,#ffb347 35%,transparent);color:var(--text)}
/* segmented */
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;color:var(--muted);padding:5px 12px;border-radius:8px;font-weight:600;transition:all .2s}
.seg button.on{background:linear-gradient(135deg,var(--accentHi),var(--accent));color:#141416}
/* chips */
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12px;color:var(--muted)}
.chip.on{border-color:var(--accent);color:var(--accent)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.chip.on .dot{background:var(--accent);box-shadow:0 0 8px var(--accent);animation:pulse 1.6s steps(6,jump-none) infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
/* monitor card */
.mon{position:relative;overflow:hidden}
.mon .ind{margin-top:10px;border-left:3px solid var(--accent);padding-left:12px;max-height:0;opacity:0;transition:max-height .45s cubic-bezier(.2,.7,.2,1),opacity .35s,margin .35s;margin-top:0}
.mon.split .ind{max-height:220px;opacity:1;margin-top:10px}
.mon .name{font-weight:700;font-size:15px}
.badge{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.mon.split .badge{color:var(--accent);border-color:var(--accent)}
.note{font-size:11.5px;color:var(--muted);margin-top:8px}
kbd{background:var(--surface);border:1px solid var(--line);border-bottom-width:2px;border-radius:7px;padding:3px 9px;font-weight:600;font-size:12.5px;min-width:64px;display:inline-block;text-align:center;cursor:pointer;transition:all .15s}
kbd:hover{border-color:var(--accent);color:var(--accent)}
kbd.cap{background:var(--accent);color:#141416;border-color:var(--accent);animation:pulse 1s infinite}
kbd.empty{color:var(--muted)}
/* settings layout */
.settings{display:flex;flex:1;min-height:0}
.nav{width:200px;flex:none;border-right:1px solid color-mix(in srgb,var(--line) 80%,transparent);padding:12px 10px;display:flex;flex-direction:column;gap:4px;background:color-mix(in srgb,var(--panelS) 55%,transparent)}
.nav button{text-align:left;border:0;background:transparent;color:var(--muted);padding:9px 12px;border-radius:10px;font-weight:600;display:flex;gap:10px;align-items:center;transition:all .2s}
.nav button:hover{background:var(--panelS);color:var(--text)}
.nav button.on{background:linear-gradient(135deg,var(--accentHi),var(--accent));color:#141416;box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 30%,transparent)}
.nav .spacer{flex:1}
.content{flex:1;overflow:auto;padding:6px 22px 24px}
.page{display:none}.page.on{display:block}
.intro{margin:16px 0 6px}
.intro h2{margin:0;font-size:20px;font-weight:700;color:var(--text)}
.intro p{margin:4px 0 0;color:var(--muted);font-size:12.5px;max-width:640px;line-height:1.5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.theme-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:10px}
.theme{border:2px solid var(--line);border-radius:12px;padding:10px;cursor:pointer;transition:all .2s;background:var(--surface)}
.theme:hover{transform:translateY(-2px)}
.theme.on{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.theme .sw3{display:flex;gap:4px;margin-top:6px}
.theme .sw3 i{flex:1;height:14px;border-radius:5px}
.swatches{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;margin-top:8px}
.swatch{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px}
.swatch label{position:relative;width:64px;height:28px;border-radius:8px;border:1px solid var(--line);overflow:hidden;cursor:pointer}
.swatch input{position:absolute;inset:-6px;width:calc(100% + 12px);height:calc(100% + 12px);border:0;padding:0;cursor:pointer}
canvas#curve{width:100%;height:190px;border-radius:10px;border:1px solid var(--line);background:var(--graphBg);display:block}
table.hk{width:100%;border-collapse:separate;border-spacing:0 6px}
table.hk th{font-weight:600;color:var(--muted);font-size:11.5px;text-align:center}
table.hk td:first-child{font-weight:600;white-space:nowrap}
table.hk td{text-align:center}
table.sch{width:100%;border-collapse:separate;border-spacing:0 6px}
table.sch th{color:var(--muted);font-size:11.5px;font-weight:600;text-align:left}
table.sch td{padding:0 4px}
.status{font-size:12.5px;color:var(--muted);line-height:1.5}
.toast{position:fixed;z-index:60;left:50%;bottom:18px;transform:translate(-50%,20px);background:var(--panelS);border:1px solid var(--accent);color:var(--text);padding:9px 16px;border-radius:12px;opacity:0;transition:all .3s;pointer-events:none;box-shadow:var(--shadow);font-size:13px}
.toast.on{opacity:1;transform:translate(-50%,0)}
.hidden{display:none!important}
/* thin strip over the header so presses on the very top edge reach the page (resize) instead of the native drag region */
#gripTop{position:fixed;top:0;left:0;right:0;height:6px;z-index:50;app-region:no-drag;-webkit-app-region:no-drag}

/* ---------- lively effects (Appearance > Lively effects): the theme's two accents as ambient glow and gradients ---------- */
#amb{position:fixed;inset:-15%;z-index:0;pointer-events:none;display:none;
  background:
    radial-gradient(40% 32% at 14% 8%, color-mix(in srgb,var(--accent) 34%,transparent), transparent 70%),
    radial-gradient(46% 38% at 88% 78%, color-mix(in srgb,var(--accent2) 32%,transparent), transparent 70%),
    radial-gradient(30% 26% at 70% 40%, color-mix(in srgb,var(--accent2) 14%,transparent), transparent 70%);
  animation:ambDrift 28s steps(84,jump-none) infinite alternate;will-change:transform}
@keyframes ambDrift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(3%,-2%) scale(1.06)}100%{transform:translate(-3%,3%) scale(1.02)}}
html.lively #amb{display:block}
html.lively{--grad:linear-gradient(135deg,var(--accent),var(--accent2))}
html.lively .hdr .logo{background:var(--grad);box-shadow:0 0 22px color-mix(in srgb,var(--accent2) 40%,transparent),var(--hl)}
html.lively .hdr .t b{background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
html.lively .hdr{border-bottom-color:transparent;background-image:linear-gradient(180deg,var(--panelS),transparent),linear-gradient(90deg,color-mix(in srgb,var(--accent) 55%,transparent),color-mix(in srgb,var(--accent2) 55%,transparent));background-size:100% 100%,100% 1px;background-position:0 0,0 100%;background-repeat:no-repeat}
html.lively .btn.primary,html.lively .nav button.on,html.lively .seg button.on{background:var(--grad)}
html.lively .btn.primary{box-shadow:0 4px 16px color-mix(in srgb,var(--accent2) 35%,transparent)}
html.lively .sw input:checked+.k{background:linear-gradient(135deg,var(--check),var(--accent2));border-color:transparent;box-shadow:0 0 12px color-mix(in srgb,var(--accent2) 40%,transparent)}
html.lively .cb input:checked+.b{background:linear-gradient(135deg,var(--check),var(--accent2));border-color:transparent}
html.lively input[type=range]::-webkit-slider-runnable-track{background:linear-gradient(90deg,var(--fill) 0,color-mix(in srgb,var(--fill) 30%,var(--accent2)) var(--p,50%),var(--track) var(--p,50%) 100%)}
html.lively .sl .lab .v{background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
html.lively .sl.off .lab .v{-webkit-text-fill-color:var(--muted)}
html.lively .sec::after{background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 45%,var(--line)),color-mix(in srgb,var(--accent2) 30%,transparent) 60%,transparent)}
html.lively .card{border-color:color-mix(in srgb,var(--line) 75%,var(--accent2) 25%);background:linear-gradient(160deg,color-mix(in srgb,var(--panelS) 80%,transparent),color-mix(in srgb,var(--panelS) 70%,transparent));backdrop-filter:blur(14px) saturate(1.3)}
html.lively .card:hover{box-shadow:var(--hl),0 12px 30px color-mix(in srgb,var(--accent2) 16%,transparent);border-color:color-mix(in srgb,var(--accent) 45%,var(--accent2))}
html.lively .mon.split .ind{border-image:linear-gradient(180deg,var(--accent),var(--accent2)) 1}
@media (prefers-reduced-motion: reduce){#amb{animation:none}}
html.idle #amb,html.idle .hdr .logo::after,html.idle .chip.on .dot{animation-play-state:paused}
/* Northern Lights: a vivid aurora over a polar night. Glows in the theme's green and violet, curtains (green, teal,
   violet with a pink fringe) swaying across the upper sky with faint vertical rays, stars behind. Shown even with lively
   effects off (then still); the curtains are one blurred layer that only moves, 3 steps a second, so they stay cheap. */
html.aurora #amb{display:block;
  background:
    radial-gradient(55% 40% at 18% 6%, color-mix(in srgb,var(--accent) 52%,transparent), transparent 70%),
    radial-gradient(50% 42% at 86% 12%, color-mix(in srgb,var(--accent2) 50%,transparent), transparent 70%),
    radial-gradient(40% 30% at 52% 30%, color-mix(in srgb,#19E3D0 30%,transparent), transparent 72%),
    radial-gradient(70% 45% at 50% 108%, color-mix(in srgb,#0B4B6B 60%,transparent), transparent 70%)}
html.aurora #amb::before{content:'';position:absolute;inset:-4% -12% 8% -12%;pointer-events:none;
  background:
    repeating-linear-gradient(92deg,transparent 0 18px,rgba(255,255,255,.07) 18px 21px),
    linear-gradient(100deg,transparent 10%,color-mix(in srgb,var(--accent) 80%,transparent) 22%,transparent 33%),
    linear-gradient(78deg,transparent 32%,color-mix(in srgb,#19E3D0 62%,transparent) 43%,transparent 54%),
    linear-gradient(104deg,transparent 50%,color-mix(in srgb,var(--accent2) 72%,transparent) 61%,color-mix(in srgb,#FF4FD8 40%,transparent) 67%,transparent 76%),
    linear-gradient(86deg,transparent 70%,color-mix(in srgb,var(--accent) 48%,transparent) 80%,transparent 90%);
  filter:blur(13px) saturate(1.45);transform-origin:50% 0;
  -webkit-mask-image:linear-gradient(to bottom,#000 0%,#000 42%,transparent 96%);mask-image:linear-gradient(to bottom,#000 0%,#000 42%,transparent 96%);
  animation:auroraSway 24s steps(72,jump-none) infinite alternate;will-change:transform}
@keyframes auroraSway{0%{transform:skewX(-7deg) translateX(-5%) scaleY(1)}50%{transform:skewX(5deg) translateX(4%) scaleY(1.12)}100%{transform:skewX(-2deg) translateX(-1%) scaleY(.94)}}
html.aurora #amb::after{content:'';position:absolute;inset:0;pointer-events:none;opacity:.7;
  background-image:radial-gradient(1px 1px at 12% 18%,#fff,transparent),radial-gradient(1px 1px at 27% 42%,#dff,transparent),
    radial-gradient(1.5px 1.5px at 43% 12%,#fff,transparent),radial-gradient(1px 1px at 58% 33%,#eef,transparent),
    radial-gradient(1px 1px at 71% 9%,#fff,transparent),radial-gradient(1.5px 1.5px at 84% 27%,#dff,transparent),
    radial-gradient(1px 1px at 92% 51%,#fff,transparent),radial-gradient(1px 1px at 6% 61%,#eef,transparent),
    radial-gradient(1px 1px at 36% 70%,#fff,transparent),radial-gradient(1px 1px at 66% 64%,#dff,transparent)}
/* cards let more of the sky through */
html.aurora.lively .card{background:linear-gradient(160deg,color-mix(in srgb,var(--panelS) 66%,transparent),color-mix(in srgb,var(--panelS) 54%,transparent));
  border-color:color-mix(in srgb,var(--accent) 22%,color-mix(in srgb,var(--line) 70%,var(--accent2) 30%))}
html.aurora:not(.lively) #amb,html.aurora:not(.lively) #amb::before{animation:none}
html.idle.aurora #amb::before{animation-play-state:paused}
@media (prefers-reduced-motion: reduce){html.aurora #amb::before{animation:none}}
</style>
</head>
<body>
<div id="wp"></div>
<div id="amb"></div>
<div id="gripTop"></div>
<div id="app"></div>
<div id="toast" class="toast"></div>
<script>
'use strict';
const post = (...a) => window.chrome?.webview?.postMessage(a.join('|'));
const VIEW = window.SD_VIEW || 'flyout';
let S = null;                       // last state from AutoHotkey
let capturing = '';                 // "master:HWUp" or "mon:2:SWUp" while a hotkey is being captured
let page = 'brightness';            // settings nav
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KINDS = ['HWUp','HWDown','SWUp','SWDown'];
const KIND_LABEL = {HWUp:'Backlight ▲',HWDown:'Backlight ▼',SWUp:'Software ▲',SWDown:'Software ▼'};
let toastT;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),1800); }

/* ---------- theme ---------- */
function applyTheme(t){
  const r=document.documentElement.style;
  const map={bg:'bg',input:'panel',line:'line',text:'text',muted:'muted',accent:'accent',accent2:'accent2',btnFace:'btn',btnText:'btnText',checkOn:'check',sliderTrack:'track',sliderFill:'fill',sliderThumb:'thumb',graphBg:'graphBg',grid:'grid'};
  for(const k in map) if(t[k]) r.setProperty('--'+map[k],'#'+t[k]);
  if(!t.accent2 && t.accent) r.setProperty('--accent2','#'+t.accent);
  document.documentElement.classList.toggle('glass', !!(S&&S.glass));
  document.documentElement.classList.toggle('lively', !!(S&&S.lively));
  document.documentElement.classList.toggle('aurora', !!(S&&S.theme==='Northern Lights'));
  if(S) r.setProperty('--op', (S.glassOpacity||65)+'%');
  r.setProperty('--wr', (window.SD_RADIUS||14)+'px');
  applyWallpaperLayer();
}
/* frosted wallpaper layer (glass + Wallpaper theme): the engine sends the image URL, the screen size and the
   window's offset on that screen; the image is laid out like Windows "Fill" (cover, centred) and shifted so the
   part under the window lines up with the real wallpaper. */
let wpImg=null, wpNat=null;
function applyWallpaperLayer(){
  const on = !!(S && S.glass && S.wpFrost && S.theme==='Wallpaper' && S.wp && S.wp.img);
  document.documentElement.classList.toggle('wp', on);
  if(!on) return;
  const el=$('#wp');
  if(wpImg!==S.wp.img){
    wpImg=S.wp.img; wpNat=null; el.style.backgroundImage=`url("${wpImg}")`;
    const im=new Image(); im.onload=()=>{ wpNat=[im.naturalWidth, im.naturalHeight]; positionWallpaper(); }; im.src=wpImg;
  }
  positionWallpaper();
}
function positionWallpaper(x, y){
  if(!wpNat || !S || !S.wp) return;
  if(x===undefined){ x=S.wp.x; y=S.wp.y; }
  const el=$('#wp'), d=devicePixelRatio||1;
  const sw=S.wp.sw/d, sh=S.wp.sh/d, wx=x/d, wy=y/d;
  const sc=Math.max(sw/wpNat[0], sh/wpNat[1]), w=wpNat[0]*sc, h=wpNat[1]*sc;
  el.style.backgroundSize=`${w}px ${h}px`;
  el.style.backgroundPosition=`${(sw-w)/2 - wx + 40}px ${(sh-h)/2 - wy + 40}px`;
}

/* ---------- widgets ---------- */
/* tick: optional tick box shown in front of the label; off: the adjustment is switched off (slider greyed, disabled) */
function slider(id,label,val,cmd,small,tick,off){
  return `<div class="sl ${small?'small':''} ${off?'off':''}"><div class="lab"><span class="n">${tick||''}${tick?'':label}</span><span class="v" id="v_${id}">${val}%</span></div>
  <input type="range" min="0" max="100" value="${val}" id="${id}" data-cmd="${cmd}" style="--p:${val}%" ${off?'disabled':''}></div>`;
}
/* the per-screen ticks: Backlight (setBacklight), Software (setDim) and Warmth (setWarm) */
const tickBL=(pfx,m,label='Backlight')=>cb(pfx+'bl'+m.idx,label,m.backlight,'setBacklight|'+m.idx,'sm');
const tickSW=(pfx,m,label='Software')=>cb(pfx+'sw'+m.idx,label,m.dim,'setDim|'+m.idx,'sm');
const tickWM=(pfx,m,label='Warmth')=>cb(pfx+'wm'+m.idx,label,m.warm,'setWarm|'+m.idx,'sm');
/* live readout + fill while the user drags (the state push later confirms the same value) */
function sliderMoved(el){
  const v=+el.value, min=+el.min||0, max=+el.max||100;
  el.style.setProperty('--p',((v-min)/(max-min)*100)+'%');
  const o=$('#v_'+el.id);
  if(o){ o.textContent=el.dataset.fmt==='warm' ? warmLabel(v, el.dataset.zero||'Off') : (el.dataset.scale ? (v*+el.dataset.scale).toFixed(1) : v)+(el.dataset.suffix??'%'); o.classList.add('bump'); setTimeout(()=>o.classList.remove('bump'),150); }
}
/* warmth 0..100 maps to 6500 K (neutral) .. 1900 K, the same formula as the engine's WarmthToKelvin */
const warmK=v=>Math.round(6500-(Math.max(0,Math.min(100,v))/100)*4600);
const warmLabel=(v,zero='Off')=>+v? `${warmK(v)} K` : zero;
function warmSlider(val,id='warm',cmd='setWarmth',label='Warmth',zero='Off',small=false){
  return `<div class="sl warm ${small?'small':''}"><div class="lab"><span class="n">${label}</span><span class="v" id="v_${id}">${warmLabel(val,zero)}</span></div>
  <input type="range" min="0" max="100" value="${val}" id="${id}" data-cmd="${cmd}" data-fmt="warm" data-zero="${zero}" style="--p:${val}%"></div>`;
}
/* colour of the light at a warmth level (same blackbody approximation as the engine), for the timeline */
function kelvinRGB(K){ const t=K/100;
  const r=t<=66?255:329.698727446*Math.pow(t-60,-0.1332047592);
  const g=t<=66?99.4708025861*Math.log(t)-161.1195681661:288.1221695283*Math.pow(t-60,-0.0755148492);
  const b=t>=66?255:(t<=19?0:138.5177312231*Math.log(t-10)-305.0447927307);
  return [r,g,b].map(v=>Math.max(0,Math.min(255,v))); }
function warmRGB(level){ const ref=kelvinRGB(6500), c=kelvinRGB(warmK(level)); return c.map((v,i)=>Math.round(255*Math.min(1,v/ref[i]))); }
/* display colour for a warmth level on the timeline: the same scale as the warmth slider's track */
const WARM_STOPS=[[0,[244,247,255]],[40,[255,217,173]],[75,[255,171,94]],[100,[255,123,36]]];
function warmDisplayRGB(v){ v=Math.max(0,Math.min(100,v));
  for(let i=1;i<WARM_STOPS.length;i++){ const [a,ca]=WARM_STOPS[i-1],[b,cb]=WARM_STOPS[i];
    if(v<=b){ const t=(v-a)/(b-a); return ca.map((c,k)=>Math.round(c+(cb[k]-c)*t)); } }
  return WARM_STOPS[WARM_STOPS.length-1][1]; }
const PHASE_ICON={Daytime:'☀️',Evening:'🌇',Bedtime:'🌙'};
/* explains the chosen transition with the user's own times, e.g. "Bedtime at 23:00 is fully warm at 00:00" */
function transitionNote(ws){
  const at=n=>(ws.phases.find(p=>p.name===n)||{}).time||'';
  const plus=(t,m)=>{ const x=/^(\d{1,2}):(\d{2})$/.exec(t); if(!x) return t; const v=((+x[1])*60+(+x[2])+m)%1440; return String(Math.floor(v/60)).padStart(2,'0')+':'+String(v%60).padStart(2,'0'); };
  const bed=at('Bedtime'), day=at('Daytime');
  if(!ws.fade) return `Each part of the day switches at its time: Bedtime at ${bed} is fully warm at once, and Daytime at ${day} is neutral at once.`;
  return `Each part of the day begins at its time and takes this long to reach its warmth: Bedtime at ${bed} is fully warm at ${plus(bed,ws.fade)}, and Daytime at ${day} is back to neutral by ${plus(day,ws.fade)}.`;
}
function sw(id,label,on,cmd){ return `<label class="sw"><input type="checkbox" id="${id}" ${on?'checked':''} data-cmd="${cmd}"><span class="k"></span><span>${label}</span></label>`; }
function cb(id,label,on,cmd,cls=''){ return `<label class="cb ${cls}"><input type="checkbox" id="${id}" ${on?'checked':''} data-cmd="${cmd}"><span class="b"></span><span>${label}</span></label>`; }
/* hotkeys are stored in AutoHotkey notation (^Up, #Down, +!F9, XButton1); show them the way people say them */
const KEY_NAMES={LButton:'Left click',RButton:'Right click',MButton:'Middle click',XButton1:'Mouse back',XButton2:'Mouse forward',
  WheelUp:'Wheel up',WheelDown:'Wheel down',PgUp:'Page Up',PgDn:'Page Down',NumpadAdd:'Num +',NumpadSub:'Num −',NumpadMult:'Num *',NumpadDiv:'Num /',Escape:'Esc'};
function prettyKey(s){
  if(!s) return '';
  let mods=[], i=0;
  while(i<s.length-1 && '^!+#'.includes(s[i])){ mods.push({'^':'Ctrl','!':'Alt','+':'Shift','#':'Win'}[s[i]]); i++; }
  const k=s.slice(i);
  return [...mods, KEY_NAMES[k]||k.replace(/^Numpad(\d)$/,'Num $1')].join(' + ');
}
function keyBox(val,id){ const cap=capturing===id; return `<kbd class="${cap?'cap':(val?'':'empty')}" data-cap="${id}" title="Click, then press keys. Esc clears.">${cap?'Press…':(esc(prettyKey(val))||'–')}</kbd>`; }

/* ---------- one set of delegated listeners: survives every re-render, nothing to rebind ---------- */
const app = $('#app');
app.addEventListener('input', e=>{
  const el=e.target;
  if(el.type==='range' && el.dataset.cmd){ sliderMoved(el); post(...el.dataset.cmd.split('|'), el.value); }
  else if(el.type==='color' && el.dataset.slot) el.parentElement.style.background=el.value;
});
app.addEventListener('change', e=>{
  const el=e.target;
  if(el.type==='checkbox' && el.dataset.cmd) post(...el.dataset.cmd.split('|'), el.checked?1:0);
  else if(el.id==='targets' || el.id==='targets2') post('setTargets', el.value);
  else if(el.dataset.env) post('env','slot',el.dataset.env,el.value);
  else if(el.dataset.sched) post('sched','row',...el.dataset.sched.split('|'), el.value);
  else if(el.type==='color' && el.dataset.slot) post('setThemeColor', el.dataset.slot, el.value.slice(1).toUpperCase());
});
/* a part-of-day time is sent when you leave the field or press Enter: sending every keystroke applied
   half-typed times (e.g. 0 then 02 then 02:3) to the screens */
/* plain 24-hour time fields (a native time box follows the PC's 12-hour format and changes with the mouse wheel
   and arrow keys while it has focus, which flipped times such as 11 PM to 1 PM by accident).
   Accepts 21:30, 2130, 930, 9, 9:30 pm, 12 am; anything else puts the old time back. */
function parseTime(v){
  const m=/^\s*(\d{1,2})(?::?(\d{2}))?\s*([ap])?\.?\s*m?\.?\s*$/i.exec(v||''); if(!m) return null;
  let h=+m[1], mi=m[2]?+m[2]:0; const ap=(m[3]||'').toLowerCase();
  if(ap){ if(h<1||h>12) return null; h=(h%12)+(ap==='p'?12:0); }
  if(h>23||mi>59) return null;
  return String(h).padStart(2,'0')+':'+String(mi).padStart(2,'0');
}
function commitWs(el){
  if(!S || !S.warmSched) return;
  const ph=S.warmSched.phases.find(p=>p.name===el.dataset.ws); if(!ph) return;
  const t=parseTime(el.value);
  if(!t){ el.value=ph.time; if(el.value!=='' ) toast('Use a 24-hour time like 21:30.'); return; }
  el.value=t;
  if(t===ph.time) return;
  for(const st of [S, pendingState]) if(st && st.warmSched){ const p2=st.warmSched.phases.find(p=>p.name===el.dataset.ws); if(p2) p2.time=t; }
  post('warmSched','time',el.dataset.ws,t);
}
app.addEventListener('focusout', e=>{ if(e.target.dataset && e.target.dataset.ws) commitWs(e.target); });
app.addEventListener('keydown', e=>{
  if(e.key==='Enter' && e.target.dataset && e.target.dataset.ws) e.target.blur();
  if(e.key==='Enter' && e.target.id==='locq'){ searchPlace(); e.target.blur(); }   /* blur so the results are shown at once */
});
let lastPlaceQuery='';
function searchPlace(){ const el=$('#locq'); const q=(el?el.value:'').replace(/\|/g,' ').trim(); if(!q) return; lastPlaceQuery=q; post('env','search',q); }
app.addEventListener('click', e=>{
  /* segmented buttons switch at once; the state push that follows confirms it */
  const sb=e.target.closest('.seg button');
  if(sb) sb.parentElement.querySelectorAll('button').forEach(b=>b.classList.toggle('on', b===sb));
  const k=e.target.closest('kbd[data-cap]');
  if(k){ capturing=k.dataset.cap; render(); post('capture',...capturing.split(':')); }
});
/* Esc closes the window (not while a hotkey is being captured, and a focused text field just loses focus) */
document.addEventListener('keydown', e=>{
  if(e.key!=='Escape' || capturing) return;
  const a=document.activeElement;
  if(a && a.tagName==='INPUT' && a.type!=='range' && a.type!=='checkbox'){ a.blur(); return; }
  post(VIEW==='flyout' ? 'hideFlyout' : 'hideSettings');
});
app.addEventListener('mousedown', e=>{
  if(window.SD_NATIVE_DRAG) return;
  if(e.button===0 && e.target.closest('#hdr') && !e.target.closest('button')) post('drag');
});

/* ---------- header ---------- */
function header(sub, closeCmd){
  const right = VIEW==='flyout'
    ? `<button class="icon-btn" title="Swap primary display: make the next screen the main one" onclick="post('flipPrimary')">⇄</button><button class="icon-btn" title="Identify screens: show each screen's name on it" onclick="post('identify')">👁</button><button class="icon-btn big" title="Settings" onclick="post('openSettings')">⚙</button>`
    : `<button class="icon-btn close" title="Close" onclick="post('${closeCmd}')">✕</button>`;
  return `<div class="hdr" id="hdr"><div class="logo">☀</div><div class="t"><b>Smart Dimmer</b><span>${sub}</span></div>${right}</div>`;
}

/* ---------- flyout ---------- */
/* The flyout is for everyday adjusting only; everything you set once lives in Settings. */
function renderFlyout(){
  const anySplit = S.monitors.some(m=>m.split);
  let h = header(`v${S.version} · drag to move`) + `<div class="scroll stagger">`;
  h += `<div class="sec">Brightness</div>`;
  if(anySplit) h += `<div class="card"><div class="muted">The shared sliders are hidden while a screen uses its own sliders. Turn off <b>Own sliders</b> on every screen to bring them back.</div></div>`;
  else {
    /* per-screen ticks under each shared slider: untick a screen to stop that adjustment on it at once */
    const appliesTo=(tick)=>`<div class="ticks"><span class="lbl">Applies to</span>${S.monitors.map(m=>tick('f',m,esc(m.name))).join('')}</div>`;
    h += `<div class="card">${slider('hw','Backlight',S.hw,'setHW')}${appliesTo(tickBL)}${slider('sw','Software brightness',S.sw,'setSW')}${appliesTo(tickSW)}
      <div style="margin-top:12px">${sw('link','Move both together',S.linkHWSW,'setLinkHWSW')}</div>
      <div class="note">Backlight changes the monitor itself. Software brightness darkens the picture and can go below the monitor's minimum. Untick a screen to leave it alone.</div></div>`;
  }
  /* warmth: its own section below Brightness; each screen has its own Warmth tick */
  h += `<div class="sec">Warmth</div><div class="card">${warmSlider(S.warmth)}<div class="ticks"><span class="lbl">Applies to</span>${S.monitors.map(m=>tickWM('f',m,esc(m.name))).join('')}</div>
      <div class="note">Shifts the colours towards orange to cut blue light in the evening. Works on its own: a screen does not need software brightness for it.</div>
      <div class="row between" style="margin-top:12px">${sw('wsOn','Change warmth by time of day',S.warmSched.enabled,'warmSched|enabled')}
        <button class="btn sm ghost" onclick="post('openSettings','warmth')">Edit ›</button></div>
      ${S.warmSched.enabled?`<div class="row between" style="gap:10px;align-items:flex-start"><div class="note">${esc(S.warmSched.status)}</div>${S.warmSched.paused?`<button class="btn sm" style="margin-top:6px" onclick="post('warmSched','resume')">Resume</button>`:''}</div>`:''}
      ${S.nightLight?`<div class="warnline"><span>⚠</span><span>Windows Night Light is on as well. Both tint the screen, so they add up; turn one of them off.</span></div>`:''}</div>`;
  h += `<div class="sec">Screens</div>`;
  for(const m of S.monitors){
    h += `<div class="card mon ${m.split?'split':''}"><div class="row between"><div class="row"><span class="name">${esc(m.name)}</span>${m.primary?'<span class="badge">Main</span>':''}</div>
      ${sw('own'+m.idx,'Own sliders',m.split,'setSplit|'+m.idx)}</div>
      ${anySplit && !m.split ? `<div class="ticks" style="margin:10px 0 0">${tickBL('c',m)}${tickSW('c',m)}</div>` : ''}
      <div class="ind">${slider('mhw'+m.idx,'Backlight',m.hw,'setMonHW|'+m.idx,true,tickBL('o',m),!m.backlight)}${slider('msw'+m.idx,'Software brightness',m.sw,'setMonSW|'+m.idx,true,tickSW('o',m,'Software brightness'),!m.dim)}</div></div>`;
  }
  const sc=S.sched;
  h += `<div class="sec">Schedule</div><div class="card"><div class="row between">${sw('schedOn','Change brightness by time of day',sc.enabled,'sched|enabled')}
      <button class="btn sm ghost" onclick="post('openSettings','schedule')">Edit ›</button></div>
      ${sc.enabled?`<div class="note">${esc(sc.status1)}</div>`:''}</div>`;
  h += `</div>`;
  return h;
}

/* ---------- settings ---------- */
/* one topic per page; every page opens with a line saying what it is for */
const NAV=[['brightness','☀','Brightness'],['warmth','🌙','Warmth'],['screens','🖥','Screens'],['hotkeys','⌨','Hotkeys'],['schedule','⏰','Schedule'],['appearance','🎨','Appearance'],['general','⚙','General']];
const PAGE_ALIAS={monitors:'screens', displays:'screens', defaults:'general', nightlight:'warmth'};
function intro(title, text){ return `<div class="intro"><h2>${title}</h2><p>${text}</p></div>`; }
function renderSettings(){
  let h = header('Settings', 'hideSettings') + `<div class="settings"><div class="nav">`;
  for(const [id,ic,lab] of NAV) h += `<button class="${page===id?'on':''}" onclick="go('${id}')"><span>${ic}</span>${lab}</button>`;
  h += `<div class="spacer"></div><div class="small muted" style="padding:0 12px">v${S.version}</div></div><div class="content">`;

  /* brightness */
  h += `<div class="page ${page==='brightness'?'on':''} stagger" id="p_brightness">
    ${intro('Brightness','How the brightness sliders and hotkeys behave. The sliders themselves are in the flyout: click the tray icon.')}
    <div class="card">${sw('link2','Move backlight and software brightness together',S.linkHWSW,'setLinkHWSW')}
      <div class="sl small" style="margin-top:10px"><div class="lab"><span class="n">Hotkey step</span><span class="v" id="v_step">${S.step}%</span></div><input type="range" min="1" max="20" value="${S.step}" id="step" data-cmd="setStep" style="--p:${(S.step-1)/19*100}%"></div>
      <div class="note">How much one hotkey press changes the brightness.</div>
      <div style="margin-top:12px">${sw('smooth','Smooth transitions',S.smooth,'setSmooth')}</div>
      <div class="note">Fades software brightness and warmth over a fifth of a second instead of jumping, when they change by more than a few percent. The backlight changes at the monitor's own pace.</div></div>
    <div class="sec">Software dimming curve</div><div class="card"><div class="grid2"><div>
      <div class="row between"><span class="muted">Type</span><span class="seg"><button class="${S.curve==='linear'?'on':''}" onclick="post('setCurve','linear')">Linear</button><button class="${S.curve==='exponential'?'on':''}" onclick="post('setCurve','exponential')">Exponential</button></span></div>
      <div style="margin-top:10px">${cb('inv','Invert curve',S.invert,'setInvert')}</div>

  const c=$('#warmchart'), ws=S&&S.warmSched; if(!c||!ws||!ws.curve||!ws.curve.length) return;

  const g=ctx.createLinearGradient(L,0,L+pw,0);
  ws.curve.forEach((v,i)=>{ const [r,gg,b]=warmDisplayRGB(v); g.addColorStop(i/n,`rgb(${r},${gg},${b})`); });

  ctx.save(); ctx.clip(); ctx.globalAlpha*=.6; ctx.fillStyle=g; ctx.fillRect(L,T,pw,ph);
  const fade=ctx.createLinearGradient(0,T,0,T+ph); fade.addColorStop(0,'rgba(0,0,0,0)'); fade.addColorStop(1,col('--graphBg')||'#000');
  ctx.globalAlpha=ws.enabled?.85:.4; ctx.fillStyle=fade; ctx.fillRect(L,T,pw,ph); ctx.restore();
  ctx.beginPath(); ws.curve.forEach((v,i)=>i?ctx.lineTo(X(i),Y(v)):ctx.moveTo(X(i),Y(v)));
  ctx.strokeStyle=g; ctx.lineWidth=3; ctx.lineJoin='round'; ctx.stroke();
  /* where each part of the day starts */
  /* where each part of the day starts; labels closer than a label's width go on a second row */
  ctx.font='12px "Segoe UI"'; ctx.fillStyle=col('--text'); ctx.strokeStyle=col('--line'); ctx.lineWidth=1;
  const marks=[];
  for(const p of ws.phases){ const m=/^(\d{1,2}):(\d{2})$/.exec(p.time); if(!m) continue;
    marks.push({x:L+((((+m[1])*60+(+m[2])-720+1440)%1440)/1440)*pw, text:`${PHASE_ICON[p.name]||''} ${p.name} ${p.time}`}); }
  marks.sort((a,b)=>a.x-b.x);
  let lastEnd=-1e9;
  for(const mk of marks){ const w=ctx.measureText(mk.text).width, cx=clampX(mk.x,w/2+2);

    ctx.fillText(mk.text, cx, y); }
  /* now, from this computer's clock so the line moves between updates */
  ctx.globalAlpha=1;
  const dt=new Date(), nowPos=(((dt.getHours()*60+dt.getMinutes()+dt.getSeconds()/60)-720+1440)%1440)/1440;
  const nx=L+nowPos*pw, nv=ws.curve[Math.round(nowPos*n)]||0;
  ctx.strokeStyle=col('--accent'); ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(nx,T-2); ctx.lineTo(nx,T+ph); ctx.stroke();
  ctx.beginPath(); ctx.arc(nx,Y(nv),5,0,Math.PI*2); ctx.fillStyle=col('--accent'); ctx.fill(); ctx.lineWidth=2; ctx.strokeStyle=col('--bg'); ctx.stroke();
}
function drawCurve(){
  const c=$('#curve'); if(!c) return; const ctx=c.getContext('2d'); const W=c.width,H=c.height; const cs=getComputedStyle(document.documentElement);
  ctx.fillStyle=cs.getPropertyValue('--graphBg').trim(); ctx.fillRect(0,0,W,H);
  ctx.strokeStyle=cs.getPropertyValue('--grid').trim(); ctx.setLineDash([3,5]); ctx.lineWidth=1;
  for(let i=1;i<4;i++){ ctx.beginPath(); ctx.moveTo(0,H*i/4); ctx.lineTo(W,H*i/4); ctx.moveTo(W*i/4,0); ctx.lineTo(W*i/4,H); ctx.stroke(); }
  ctx.setLineDash([]); ctx.strokeStyle=cs.getPropertyValue('--accent').trim(); ctx.lineWidth=4; ctx.lineJoin='round'; ctx.lineCap='round';
  const f=S.factor/10, exp=S.curve==='exponential', inv=!!S.invert, pad=4;
  ctx.beginPath();
  for(let i=0;i<=60;i++){ const x=i/60; let y=x; if(exp) y = inv ? Math.pow(x,f) : 1-Math.pow(1-x,f); const px=pad+x*(W-2*pad), py=pad+(1-y)*(H-2*pad); i?ctx.lineTo(px,py):ctx.moveTo(px,py); }
  ctx.stroke();
  const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,cs.getPropertyValue('--accent').trim()+'55'); g.addColorStop(1,cs.getPropertyValue('--accent').trim()+'00');
  ctx.lineTo(W-pad,H-pad); ctx.lineTo(pad,H-pad); ctx.closePath(); ctx.fillStyle=g; ctx.fill();
}

/* ---------- render: build the markup, then patch the live DOM in place ----------
   Existing elements are kept (no replayed entry animation, hover/focus/scroll survive);
   only elements that really appear or disappear are inserted or removed. */
function render(){
  if(!S) return;
  applyTheme(S.themes[S.theme]||S.themes['Lava Orange']);
  const tpl=document.createElement('template');
  tpl.innerHTML = VIEW==='flyout' ? renderFlyout() : renderSettings();
  morphChildren(app, tpl.content);
  if(VIEW!=='flyout'){ drawCurve(); drawWarmChart(); }
  measureAreas();
}
/* ---------- Wallpaper theme: measure how much of this window each colour group really covers, so the engine
   can give the most common wallpaper colour to the largest group, and so on ---------- */
let lastAreaOrder='';
function measureAreas(){
  const W=innerWidth, H=innerHeight, total=W*H; if(W<200 || H<200) return;   /* not while the window is still hidden / tiny */
  /* once per window size: re-measuring on every state change or page switch would recolour the window while you use it */
  const key=W+'x'+H; if(key===measureAreas._k) return; measureAreas._k=key;
  const area=el=>{ const r=el.getBoundingClientRect(); const w=Math.max(0,Math.min(r.right,W)-Math.max(r.left,0)), h=Math.max(0,Math.min(r.bottom,H)-Math.max(r.top,0)); return w*h; };
  const sum=(sel,f=1)=>[...document.querySelectorAll(sel)].reduce((a,el)=>a+area(el)*f,0);
  let panel = sum('.card') + sum('.nav',0.55) + sum('.hdr',0.5) + sum('.toast.on');
  let btn = sum('.btn:not(.primary)') + sum('.seg') + sum('kbd') + sum('.field') + sum('.chip') + sum('.theme') + sum('.sw input:not(:checked)+.k') + sum('.cb input:not(:checked)+.b');
  let accent = sum('.btn.primary') + sum('.nav button.on') + sum('.v') + sum('.sec',0.35) + sum('.logo') + sum('.seg button.on') + sum('.icon-btn.big',0.4) + sum('.theme.on',0.15);
  let fill = sum('.sw input:checked+.k') + sum('.cb input:checked+.b'), thumb=0;
  document.querySelectorAll('input[type=range]').forEach(el=>{ const r=el.getBoundingClientRect(); if(!r.width) return; const p=(+el.value-(+el.min||0))/((+el.max||100)-(+el.min||0)); btn+=r.width*6*(1-p); fill+=r.width*6*p; thumb+=400; });
  accent += thumb;
  let line = [...document.querySelectorAll('.card')].reduce((a,el)=>{ const r=el.getBoundingClientRect(); return a + (r.width?2*(r.width+r.height):0); },0)
           + [...document.querySelectorAll('.sec')].reduce((a,el)=>a+el.getBoundingClientRect().width*0.65,0) + W*2 + sum('canvas#curve',0.06) + sum('table.hk',0.02);
  const bg = Math.max(0, total - panel - btn - accent - fill - line);
  const parts=[['panel',panel],['bg',bg],['btn',btn],['line',line],['fill',fill],['accent',accent]].sort((a,b)=>b[1]-a[1]);
  const order=parts.map(x=>x[0]).join('>');
  if(order!==lastAreaOrder){ lastAreaOrder=order; post('uiAreas', order, parts.map(x=>x[0]+' '+Math.round(x[1]/total*100)+'%').join(', ')); }
}
addEventListener('resize', ()=>{ clearTimeout(measureAreas._t); measureAreas._t=setTimeout(measureAreas,150); drawWarmChart(); });
setInterval(()=>{ if(VIEW!=='flyout') drawWarmChart(); }, 30000);
function sameNode(a,b){
  if(a.nodeType!==b.nodeType) return false;
  if(a.nodeType!==1) return true;
  const kind=el=>(el.className||'').split(' ')[0];
  return a.tagName===b.tagName && (a.id||'')===(b.id||'') && kind(a)===kind(b) && (a.getAttribute('type')||'')===(b.getAttribute('type')||'');
}
function morphChildren(oldP,newP){
  const oldKids=[...oldP.childNodes], newKids=[...newP.childNodes];
  for(let i=0;i<newKids.length;i++){
    const o=oldKids[i], n=newKids[i];
    if(!o) oldP.appendChild(n);
    else if(sameNode(o,n)) morphNode(o,n);
    else oldP.replaceChild(n,o);
  }
  for(let i=newKids.length;i<oldKids.length;i++) oldKids[i].remove();
}
function morphNode(o,n){
  if(o.nodeType===3){ if(o.nodeValue!==n.nodeValue) o.nodeValue=n.nodeValue; return; }
  if(o.nodeType!==1) return;
  for(const a of [...o.attributes]) if(!n.hasAttribute(a.name)) o.removeAttribute(a.name);
  for(const a of [...n.attributes]) if(o.getAttribute(a.name)!==a.value) o.setAttribute(a.name,a.value);
  if(o.tagName==='INPUT' && o!==document.activeElement){
    if(o.type==='checkbox'){ if(o.checked!==n.checked) o.checked=n.checked; }
    else if(o.value!==n.value) o.value=n.value;
  }
  if(o.tagName==='CANVAS') return;
  morphChildren(o,n);
  if(o.tagName==='SELECT' && o!==document.activeElement){ const opt=n.querySelector('option[selected]'); if(opt && o.value!==opt.value) o.value=opt.value; }
}
/* ---------- edge resize: the web view covers the whole window, so the page detects presses near
   the edges and asks the engine to start the native sizing loop (hit-test codes HTLEFT..HTBOTTOMRIGHT) ---------- */
const EDGE=6, EDGE_CUR={10:'ew-resize',11:'ew-resize',12:'ns-resize',15:'ns-resize',13:'nwse-resize',17:'nwse-resize',14:'nesw-resize',16:'nesw-resize'};
function edgeAt(x,y){
  const l=x<EDGE, r=x>=innerWidth-EDGE, t=y<EDGE, b=y>=innerHeight-EDGE;
  if(t&&l) return 13; if(t&&r) return 14; if(b&&l) return 16; if(b&&r) return 17;
  return l?10:r?11:t?12:b?15:0;
}
function onScrollbar(e){ const el=e.target; return el && el.nodeType===1 && el.clientWidth && (e.clientX > el.getBoundingClientRect().left + el.clientWidth); }
document.addEventListener('pointermove', e=>{ const d=edgeAt(e.clientX,e.clientY); document.documentElement.style.cursor = d ? EDGE_CUR[d] : ''; });
document.addEventListener('pointerdown', e=>{
  if(e.button!==0) return;
  const d=edgeAt(e.clientX,e.clientY);
  /* a vertical scrollbar sits flush with the right edge: its outer 3px still act as the resize grip */
  if(d && (!onScrollbar(e) || e.clientX >= innerWidth-3)){ e.preventDefault(); e.stopPropagation(); post('resize', d); }
}, true);
/* A state push must never rebuild the DOM while a slider is being dragged or a text field is being edited. */
let dragging=false, pendingState=null;
document.addEventListener('pointerdown', e=>{ if(e.target && e.target.type==='range') dragging=true; }, true);
document.addEventListener('pointerup', ()=>{ if(dragging){ dragging=false; if(pendingState){ S=pendingState; pendingState=null; capturing=S.capturing||''; render(); } } }, true);
const isEditing=a=>a && a.tagName==='INPUT' && a.type!=='range' && a.type!=='checkbox' && a.type!=='color';
document.addEventListener('focusout', ()=>setTimeout(()=>{
  if(pendingState && !dragging && !isEditing(document.activeElement)){ S=pendingState; pendingState=null; capturing=S.capturing||''; render(); }
},0));
window.chrome?.webview?.addEventListener('message', e=>{
  const d=e.data; if(!d||typeof d!=='object') return;
  if(d.type==='state'){
    const active=document.activeElement; const editing = active && active.tagName==='INPUT' && active.type!=='range' && active.type!=='checkbox' && active.type!=='color';
    if(dragging || editing){ pendingState=d; S=d; syncLight(); if(VIEW!=='flyout') drawWarmChart(); return; }
    S=d; capturing=d.capturing||''; render();
  }
  if(d.type==='toast') toast(d.text);
  if(d.type==='nav') go(d.page);
  if(d.type==='wpgeom'){ if(S&&S.wp){ S.wp.x=d.x; S.wp.y=d.y; } positionWallpaper(d.x,d.y); }
});
/* light sync while a text field has focus: update slider values/readouts without rebuilding */
function syncLight(){
  applyTheme(S.themes[S.theme]);
  const set=(id,v,suf='%')=>{ const el=document.getElementById(id); if(el&&document.activeElement!==el){ el.value=v; el.dispatchEvent(new Event('sync')); const o=$('#v_'+id); if(o) o.textContent=v+suf; el.style.setProperty('--p',((v-(+el.min||0))/((+el.max||100)-(+el.min||0))*100)+'%'); } };
  set('hw',S.hw); set('sw',S.sw); set('hw2',S.hw); set('sw2',S.sw);
}
/* pause the ambient motion while the window is not the active one */
addEventListener('blur', ()=>document.documentElement.classList.add('idle'));
addEventListener('focus', ()=>document.documentElement.classList.remove('idle'));
if(!document.hasFocus()) document.documentElement.classList.add('idle');
post('ready');
</script>
</body>
